events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # Cấu hình Failover: Mọi request thông thường vào Backend 1, nếu sập chuyển sang 2
    # -------------------------------------------------------------------------
    upstream backend_cluster {
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 backup;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------------------
        # 1. Phục vụ ứng dụng giao diện Frontend (React/Vite)
        # -------------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            
            # Hỗ trợ React Router: Tìm file tĩnh trước, không thấy chuyển sang index.html để React handle route
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------------------------------
        # 2. Proxy chuyển tiếp các luồng dữ liệu API đến cụm máy chủ Spring Boot
        # -------------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster;
            
            # Truyền các thông tin Header định danh thực tế của client xuống backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 80;

            # Xử lý thời gian ngắt kết nối Failover nhanh chóng
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Định nghĩa các kịch bản lỗi mạng để kích hoạt máy chủ dự phòng ngay lập tức
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # -------------------------------------------------------------------------
        # 3. Các Header gia cố lớp bảo vệ trình duyệt
        # -------------------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}