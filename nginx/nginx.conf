# Khối events là bắt buộc, không được thiếu
events {
    worker_connections 1024;
}

http {
    # Định nghĩa cluster backend cho cơ chế Failover
    upstream backend_cluster {
        # Server chính
        server backend-1:8080;
        
        # Server phụ (chỉ chạy khi server chính lỗi)
        server backend-2:8080 backup;
    }

    server {
        listen 80;

        # Điều phối các API request sang backend
        location /api/ {
            proxy_pass http://backend_cluster;
            
            # Cấu hình để Spring Boot nhận biết được Proxy/Load Balancer
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 80;

            # Tối ưu hóa thời gian nhận diện server lỗi để chuyển sang backup
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }

        # Phục vụ file tĩnh của Frontend (React/Vite)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}