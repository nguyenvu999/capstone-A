# Cấu hình tối thiểu cho khối events
events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------
    # QUAN TRỌNG: Định nghĩa định dạng file (Sửa lỗi trắng trang)
    # ---------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình log để dễ dàng debug khi có lỗi
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Tối ưu hóa gửi file tĩnh
    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------------------------------------
    # Cấu hình Failover: Server phụ (backend-2) chỉ chạy khi server chính chết
    # ---------------------------------------------------------
    upstream backend_cluster {
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 backup;
    }

    server {
        listen 80;
        server_name localhost;

        # ---------------------------------------------------------
        # 1. Phục vụ Frontend (React/Vite)
        # ---------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            
            # Hỗ trợ React Router (giúp F5 trang không bị lỗi 404)
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------
        # 2. Điều phối API (Proxy sang Backend)
        # ---------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_cluster;
            
            # Truyền Header để Backend biết thông tin thật của Client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 80;

            # Xử lý Failover nhanh hơn
            proxy_connect_timeout 2s;      # Đợi kết nối 2 giây, quá là bỏ qua
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            
            # Các lỗi sẽ kích hoạt việc chuyển sang server backup
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # ---------------------------------------------------------
        # 3. Cấu hình bảo mật bổ sung (Tùy chọn)
        # ---------------------------------------------------------
        # Tránh clickjacking
        add_header X-Frame-Options "SAMEORIGIN";
        # Tránh MIME type sniffing
        add_header X-Content-Type-Options "nosniff";
    }
}