<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netsuggest</title>
    
    <style>
      body { margin: 0; background-color: #ffffff; } /* Màu nền trùng với splash screen */
      #splash-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #ffffff; /* Màu nền app */
        display: flex; justify-content: center; align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .splash-logo { width: 120px; height: auto; animation: pulse 1.5s infinite; }
      @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="splash-overlay">
       <svg class="splash-logo" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="green" />
       </svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
