<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="apple-touch-icon" href="/iconapp.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Netsuggest">

    <title>Netsuggest</title>

    <style>
      /* CSS cho màn hình chờ xuất hiện ngay lập tức */
      #splash-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #ffffff; /* Màu nền app */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .splash-logo {
        width: 120px; /* Điều chỉnh kích thước tùy ý */
        height: auto;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse { 
        0% { transform: scale(1); } 
        50% { transform: scale(1.1); } 
        100% { transform: scale(1); } 
      }
    </style>
  </head>
  <body>
    <div id="splash-overlay">
       <img src="/iconapp.png" class="splash-logo" alt="Loading...">
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
