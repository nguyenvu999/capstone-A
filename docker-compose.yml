version: '3.8'

services:
  # --- SERVER ĐIỀU PHỐI (NGINX) ---
  nginx-lb:
    image: nginx:latest
    container_name: netsuggest-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - netsuggest-net

  # --- SERVER CHÍNH (BACKEND 1) ---
  backend-1:
    build: ./backend
    container_name: netsuggest-backend-1
    environment:
      - SERVER_ID=backend-1
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.xomvatjznjjqplifhkej
      - SPRING_DATASOURCE_PASSWORD=Tg9ABbc1yP8nh5DT
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_ID=da72c7a0-2675-4aa8-808f-0ad8b61ca0f7
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_SECRET=rs_8Q~H-DsydyvCFuJ_IJXmEQzxiNlgTfduiKcZM
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_SCOPE=openid, profile, email
    networks:
      - netsuggest-net

  # --- SERVER DỰ PHÒNG (BACKEND 2) ---
  backend-2:
    build: ./backend
    container_name: netsuggest-backend-2
    environment:
      - SERVER_ID=backend-2
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.xomvatjznjjqplifhkej
      - SPRING_DATASOURCE_PASSWORD=Tg9ABbc1yP8nh5DT
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_ID=da72c7a0-2675-4aa8-808f-0ad8b61ca0f7
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_CLIENT_SECRET=rs_8Q~H-DsydyvCFuJ_IJXmEQzxiNlgTfduiKcZM
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_MICROSOFT_SCOPE=openid, profile, email
    networks:
      - netsuggest-net

networks:
  netsuggest-net:
    driver: bridge